<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunder Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}
header{background:#111;color:#d4af37;text-align:center;padding:20px}
header h1{margin:0} header p{color:white;margin:5px 0}
.hero{background:#222;color:white;text-align:center;padding:35px 15px}
.hero h2{color:#d4af37;margin:0 0 10px}
.container{width:94%;max-width:1100px;margin:25px auto}
.notice{background:#fff8dc;padding:12px;border-radius:10px;margin-bottom:20px;text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0002}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#eee}
.body{padding:15px}.body h3{margin:0 0 8px}.body p{color:#666;line-height:1.45}
.buttons{display:flex;gap:8px}.btn,button{flex:1;padding:11px;border:0;border-radius:8px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.whatsapp{background:#25D366;color:white}.share{background:#111;color:#d4af37}
footer{background:#111;color:white;text-align:center;padding:25px}footer strong{color:#d4af37}
</style>
</head>
<body>
<header><h1>THUNDER HUB</h1><p>Shop Smart. Shop Thunder.</p></header>
<section class="hero"><h2>Our Products</h2><p>View our products and chat with us on WhatsApp for price and information.</p></section>

<div class="container">
<div class="notice">📸 Upload product pictures into the <b>images</b> folder, then add the product below.</div>
<div class="products" id="productGrid"></div>
</div>

<footer><strong>Thunder Hub</strong><br><br>WhatsApp: 08032744506</footer>

<script>
const WHATSAPP="2348032744506";

/* ADD PRODUCTS HERE.
Example:
{
 name:"Samsung Phone",
 image:"images/samsung.jpg",
 description:"Quality Samsung phone. Chat with us for price."
}
*/
const products=[
{name:"Product 1",image:"images/product1.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."},
{name:"Product 2",image:"images/product2.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."},
{name:"Product 3",image:"images/product3.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."}
];

function wa(name){
return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello Thunder Hub, I want information about "+name+".");
}
function shareProduct(p){
const url=location.href.split("#")[0]+"?product="+encodeURIComponent(p.name);
if(navigator.share){navigator.share({title:p.name+" | Thunder Hub",text:"Check out "+p.name+" on Thunder Hub.",url:url}).catch(()=>{});}
else{navigator.clipboard.writeText(url).then(()=>alert("Product link copied."));}
}
const grid=document.getElementById("productGrid");
products.forEach((p,i)=>{
grid.innerHTML+=`
<div class="card">
<img src="${p.image}" alt="${p.name}" onerror="this.alt='Picture not found'">
<div class="body">
<h3>${p.name}</h3><p>${p.description}</p>
<div class="buttons">
<a class="btn whatsapp" href="${wa(p.name)}" target="_blank">💬 WhatsApp</a>
<button class="share" onclick="shareProduct(products[${i}])">🔗 Share</button>
</div></div></div>`;
});
</script>
</body>
</html>
