<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunder Hub Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f3f5;color:#111}
header{background:#090a0d;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:800}
header span{color:#ffbd00}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 4px 18px #0001}
h2{margin-top:0}
label{display:block;font-weight:700;margin:14px 0 6px}
input,textarea,select{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
.upload{background:#ffbd00}
.save{background:#111;color:#fff;width:100%;margin-top:18px}
.delete{background:#d92323;color:#fff}
.edit{background:#eee}
#preview{width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:12px;display:none;background:#eee}
.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}
.product{display:flex;gap:14px;border-top:1px solid #ddd;padding:15px 0;align-items:center}
.product img{width:100px;height:80px;object-fit:cover;border-radius:10px;background:#eee}
.product .info{flex:1}
.small{color:#666;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<header>⚡ THUNDER <span>HUB</span> ADMIN</header>

<div class="wrap">

<div class="card">
<h2>Add Product</h2>

<label>Product name</label>
<input id="name" placeholder="Example: Samsung Phone">

<label>Category</label>
<input id="category" placeholder="Example: Electronics">

<label>Price (₦)</label>
<input id="price" type="number" placeholder="Example: 250000">

<label>Description</label>
<textarea id="description" placeholder="Write product details"></textarea>

<label>Product picture</label>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview">

<div id="msg" class="msg"></div>

<button class="save" id="save">📤 Upload Product</button>
<button class="edit" id="cancel" style="display:none;width:100%;margin-top:8px">Cancel Edit</button>
</div>

<div class="card">
<h2>Products on Thunder Hub</h2>
<div id="products">Loading products...</div>
</div>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getDatabase,ref,push,set,remove,onValue} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCXL9pUlMuNySfV6PFeGa8BopcOHhlq0",
 authDomain:"thunder-hub-ab0c4.firebaseapp.com",
 databaseURL:"https://thunder-hub-ab0c4-default-rtdb.firebaseio.com",
 projectId:"thunder-hub-ab0c4",
 storageBucket:"thunder-hub-ab0c4.firebasestorage.app",
 messagingSenderId:"103451755117",
 appId:"1:103451755117:web:bc179aa67863e9756e3564"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const CLOUD_NAME="hfmbIsed";
const UPLOAD_PRESET="Thunder_hub";

const $=id=>document.getElementById(id);
let imageUrl="";
let editingId=null;

function message(text,ok=false){
 const m=$("msg");
 m.textContent=text;
 m.style.display="block";
 m.style.background=ok?"#dff7e5":"#ffe0e0";
 m.style.color=ok?"#176b2c":"#9b1c1c";
}

$("file").addEventListener("change",async()=>{
 const file=$("file").files[0];
 if(!file)return;
 if(file.size>10*1024*1024){message("Picture is bigger than 10MB.");$("file").value="";return}
 $("preview").src=URL.createObjectURL(file);
 $("preview").style.display="block";
 message("Uploading picture...");
 try{
  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset",UPLOAD_PRESET);
  const r=await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUD_NAME)+"/image/upload",{method:"POST",body:fd});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error?.message||"Cloudinary upload failed");
  imageUrl=data.secure_url;
  message("Picture uploaded. Now press Upload Product.",true);
 }catch(e){imageUrl="";message("Picture upload failed: "+e.message)}
});

$("save").onclick=async()=>{
 const name=$("name").value.trim(),category=$("category").value.trim();
 const price=$("price").value.trim(),description=$("description").value.trim();
 if(!name||!category||!price||!description){message("Please fill in all fields.");return}
 if(!imageUrl && !editingId){message("Please choose a product picture.");return}

 $("save").disabled=true;
 $("save").textContent=editingId?"Saving...":"Saving...";
 try{
  const product={name,category,price:Number(price),description};
  if(imageUrl)product.image=imageUrl;

  if(editingId) await set(ref(db,"products/"+editingId),product);
  else await set(push(ref(db,"products")),product);

  message(editingId?"Product updated successfully.":"Product added successfully.",true);
  resetForm();
 }catch(e){message("Could not save product: "+e.message)}
 $("save").disabled=false;
 $("save").textContent="📤 Upload Product";
};

function resetForm(){
 editingId=null;imageUrl="";
 $("name").value="";$("category").value="";$("price").value="";$("description").value="";
 $("file").value="";$("preview").style.display="none";$("cancel").style.display="none";
 $("save").textContent="📤 Upload Product";
}

$("cancel").onclick=resetForm;

function editProduct(id,p){
 editingId=id;
 $("name").value=p.name||"";$("category").value=p.category||"";
 $("price").value=p.price||"";$("description").value=p.description||"";
 imageUrl=p.image||"";
 if(imageUrl){$("preview").src=imageUrl;$("preview").style.display="block"}
 $("cancel").style.display="block";
 $("save").textContent="💾 Save Changes";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
 if(!confirm("Delete this product from Thunder Hub?"))return;
 try{await remove(ref(db,"products/"+id));message("Product deleted.",true)}
 catch(e){message("Delete failed: "+e.message)}
}

onValue(ref(db,"products"),snap=>{
 const box=$("products"); box.innerHTML="";
 const data=snap.val()||{};
 const entries=Object.entries(data);
 if(!entries.length){box.innerHTML="<p class='small'>No products added yet.</p>";return}
 entries.reverse().forEach(([id,p])=>{
  const row=document.createElement("div");row.className="product";
  row.innerHTML=`
   <img src="${p.image||""}" alt="">
   <div class="info">
    <b>${escapeHtml(p.name||"Product")}</b>
    <div class="small">${escapeHtml(p.category||"")} • ₦${Number(p.price||0).toLocaleString()}</div>
    <div class="small">${escapeHtml(p.description||"")}</div>
    <div class="actions" style="margin-top:8px">
      <button class="edit">✏️ Edit</button>
      <button class="delete">🗑️ Delete</button>
    </div>
   </div>`;
  row.querySelector(".edit").onclick=()=>editProduct(id,p);
  row.querySelector(".delete").onclick=()=>deleteProduct(id);
  box.appendChild(row);
 });
});

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
